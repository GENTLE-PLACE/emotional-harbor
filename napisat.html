<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Написать в блог · Эмоциональная Гавань</title>
    <link rel="icon" type="image/svg+xml" href="https://static.emotional-harbor.ru/favicon.svg">
    <link href="https://static.emotional-harbor.ru/fonts/harbor-fonts.css" rel="stylesheet">
    <style>
        :root {
            --beige: #f7efe0;
            --brown-dark: #3a3228;
            --brown-mid: #7a5840;
            --brown-light: #9a7050;
            --gold: #c9a97a;
            --pink: #e87a9c;
            --green: #b8e0d2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--beige);
            font-family: 'Jost', sans-serif;
            color: var(--brown-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(201,169,122,0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(201,169,122,0.08) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            border-radius: 24px;
            background: rgba(255, 248, 235, 0.85);
            border: 1.5px solid rgba(201, 169, 122, 0.4);
            box-shadow: 5px 7px 0 rgba(120,80,40,0.08);
            padding: 0 40px 40px;
            overflow: hidden;
        }

        .card__stripe {
            width: calc(100% + 80px);
            margin-left: -40px;
            height: 5px;
            background: var(--pink);
            margin-bottom: 28px;
        }

        .card__title {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.7px;
            margin-bottom: 6px;
        }

        .card__note {
            font-size: 13.5px;
            color: var(--brown-light);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        form { display: flex; flex-direction: column; gap: 16px; }

        label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--brown-mid);
            margin-bottom: 6px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            font-family: 'Jost', sans-serif;
            font-size: 15px;
            color: var(--brown-dark);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(201, 169, 122, 0.4);
            border-radius: 12px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--pink);
            background: #fff;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
            line-height: 1.6;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,169,122,0.35) 20%, rgba(201,169,122,0.35) 80%, transparent);
            margin: 4px 0;
        }

        button {
            padding: 15px 20px;
            font-family: 'Jost', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--beige);
            background: var(--pink);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 4px 5px 0 rgba(232,122,156,0.3);
            transition: transform 0.2s ease, box-shadow 0.25s ease, opacity 0.2s ease;
        }

        button:hover:not(:disabled) {
            transform: translate(-1px, -2px);
            box-shadow: 6px 7px 0 rgba(232,122,156,0.3);
        }

        button:disabled { opacity: 0.5; cursor: default; }

        .status {
            display: none;
            font-size: 13.5px;
            line-height: 1.6;
            padding: 12px 16px;
            border-radius: 10px;
        }

        .status.visible { display: block; }

        .status--ok {
            background: rgba(184, 224, 210, 0.35);
            color: #2a4a3c;
        }

        .status--error {
            background: rgba(232, 122, 156, 0.12);
            color: #9b3f5a;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card__stripe"></div>
        <div class="card__title">Написать в блог</div>
        <div class="card__note">Только твоя дверь. Пароль не запоминается — вводи каждый раз заново.</div>

        <form id="postForm">
            <div>
                <label for="password">Пароль</label>
                <input type="password" id="password" required autocomplete="off">
            </div>

            <div>
                <label for="title">Заголовок</label>
                <input type="text" id="title" required>
            </div>

            <div>
                <label for="text">Текст</label>
                <textarea id="text" required placeholder="Пишите как думаете — тизер для карточки и адрес ссылки сайт соберёт сам."></textarea>
            </div>

            <div class="divider"></div>

            <div id="status" class="status"></div>

            <button type="submit" id="submitBtn">Опубликовать</button>
        </form>
    </div>

    <script>
        const BLOG_API = 'https://blog.emotional-harbor.ru/posts';

        const form = document.getElementById('postForm');
        const statusEl = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        function showStatus(text, ok) {
            statusEl.textContent = text;
            statusEl.className = 'status visible ' + (ok ? 'status--ok' : 'status--error');
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const title = document.getElementById('title').value.trim();
            const text = document.getElementById('text').value.trim();

            if (!title || !text) {
                showStatus('Заполните заголовок и текст.', false);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Публикуем…';

            try {
                const res = await fetch(BLOG_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Blog-Password': password,
                    },
                    body: JSON.stringify({ title, text }),
                });

                if (res.status === 401) {
                    showStatus('Неверный пароль.', false);
                    return;
                }

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    showStatus(data.error || 'Что-то не сработало. Попробуйте ещё раз.', false);
                    return;
                }

                const post = await res.json();
                showStatus('Опубликовано ✓ — «' + post.title + '»', true);
                document.getElementById('title').value = '';
                document.getElementById('text').value = '';
            } catch (err) {
                showStatus('Не получилось связаться с блогом. Проверьте соединение.', false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Опубликовать';
            }
        });
    </script>

</body>
</html>
