<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Написать в блог · Эмоциональная Гавань</title>
    <link rel="icon" type="image/svg+xml" href="https://static.emotional-harbor.ru/favicon.svg">
    <link href="https://static.emotional-harbor.ru/fonts/harbor-fonts.css" rel="stylesheet">
    <style>
        :root {
            --beige: #f7efe0;
            --brown-dark: #3a3228;
            --brown-mid: #7a5840;
            --brown-light: #9a7050;
            --gold: #c9a97a;
            --pink: #e87a9c;
            --green: #b8e0d2;
            --ink: #2D3436;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--beige);
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            color: var(--brown-dark);
            padding: 40px 20px 80px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(201,169,122,0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(201,169,122,0.08) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; }

        h1 {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: -0.8px;
            margin-bottom: 6px;
        }

        .note { font-size: 13.5px; color: var(--brown-light); line-height: 1.6; }

        .card {
            background: rgba(255, 248, 235, 0.85);
            border: 2px solid var(--ink);
            border-radius: 20px;
            box-shadow: 6px 7px 0 rgba(45, 52, 54, 0.12);
            padding: 30px 34px;
            margin-top: 24px;
        }

        label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--brown-mid);
            margin-bottom: 6px;
        }

        .hint { font-weight: 300; color: var(--brown-light); }

        input, textarea, select {
            width: 100%;
            padding: 13px 15px;
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            font-size: 15px;
            color: var(--brown-dark);
            background: rgba(255, 255, 255, 0.6);
            border: 1.5px solid rgba(201, 169, 122, 0.5);
            border-radius: 12px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--pink);
            background: #fff;
        }

        textarea { min-height: 320px; resize: vertical; line-height: 1.7; }

        .field { margin-bottom: 16px; }

        .row { display: flex; gap: 14px; flex-wrap: wrap; }
        .row > * { flex: 1 1 240px; }

        .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }

        button {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 14px 22px;
            border: 2px solid var(--ink);
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.5);
            color: var(--brown-dark);
            box-shadow: 3px 4px 0 rgba(45, 52, 54, 0.12);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        button:hover:not(:disabled) {
            transform: translate(-1px, -2px);
            box-shadow: 5px 6px 0 rgba(45, 52, 54, 0.12);
        }

        button:disabled { opacity: 0.5; cursor: default; }

        .btn--main { background: var(--pink); color: #fff; }
        .btn--danger { background: transparent; color: #9b3f5a; border-color: #9b3f5a; box-shadow: 3px 4px 0 rgba(155,63,90,0.16); }
        .btn--quiet { border-style: dashed; box-shadow: none; }

        .status {
            display: none;
            font-size: 13.5px;
            line-height: 1.6;
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 18px;
        }

        .status.visible { display: block; }
        .status--ok { background: rgba(184, 224, 210, 0.4); color: #2a4a3c; }
        .status--error { background: rgba(232, 122, 156, 0.14); color: #9b3f5a; }

        /* --- список записей --- */

        .posts { margin-top: 14px; }

        .post-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 14px 0;
            border-bottom: 1px dashed rgba(201, 169, 122, 0.5);
        }

        .post-row:last-child { border-bottom: none; }

        .post-row__main { flex: 1 1 280px; min-width: 0; }

        .post-row__title {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            font-size: 14px;
            line-height: 1.35;
        }

        .post-row__meta { font-size: 12.5px; color: var(--brown-light); margin-top: 4px; }

        .tag {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 20px;
            margin-right: 8px;
        }

        .tag--draft { background: rgba(201, 169, 122, 0.3); color: var(--brown-mid); }
        .tag--live { background: rgba(184, 224, 210, 0.5); color: #2a4a3c; }

        .post-row__actions { display: flex; gap: 8px; }
        .post-row__actions button { padding: 9px 14px; font-size: 10px; }

        .restore {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 13.5px;
            line-height: 1.6;
            background: rgba(247, 208, 138, 0.3);
            border: 1.5px dashed var(--gold);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 20px;
        }

        .restore__actions { display: flex; gap: 8px; }
        .restore__actions button { padding: 9px 14px; font-size: 10px; }

        .draft-mark {
            font-size: 12px;
            color: var(--brown-light);
            margin-top: 14px;
            min-height: 18px;
        }

        /* --- предпросмотр --- */

        .preview {
            display: none;
            margin-top: 24px;
            padding: 30px 34px;
            background: rgba(255, 248, 235, 0.85);
            border: 2px dashed var(--gold);
            border-radius: 20px;
        }

        .preview.visible { display: block; }

        .preview h2 {
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            font-size: 19px;
            margin: 28px 0 14px;
        }

        .preview h3 { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 15px; margin: 24px 0 10px; }
        .preview p { margin-bottom: 18px; line-height: 1.85; }

        .preview .lead {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 18px;
            color: var(--brown-mid);
            padding-left: 18px;
            border-left: 3px solid var(--gold);
        }

        .preview blockquote {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 17px;
            color: var(--brown-mid);
            padding-left: 20px;
            border-left: 3px solid var(--pink);
            margin: 24px 0;
        }

        .preview ul, .preview ol { margin: 0 0 20px 22px; }
        .preview li { margin-bottom: 8px; }
        .preview strong { font-weight: 500; }
        .preview a { color: var(--pink); }
        .preview em { font-style: italic; }
        .preview .shot { margin: 24px 0; }
        .preview .shot img { display: block; width: 100%; border-radius: 16px; border: 2px solid var(--ink); }
        .preview .shot figcaption { font-family: 'Caveat', cursive; font-size: 17px; color: var(--brown-light); text-align: center; margin-top: 8px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="wrap">

    <h1>Написать в блог</h1>
    <div class="note">Только своя дверь. Пароль не запоминается — вводится каждый раз заново.</div>

    <!-- ВХОД -->
    <div class="card" id="gate">
        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" autocomplete="off">
        </div>
        <div class="buttons">
            <button type="button" class="btn--main" id="enterBtn">Войти</button>
        </div>
        <div id="gateStatus" class="status"></div>
    </div>

    <!-- СПИСОК ЗАПИСЕЙ -->
    <div class="card hidden" id="listCard">
        <label>Записи</label>
        <div class="posts" id="posts"></div>
        <div class="buttons">
            <button type="button" class="btn--main" id="newBtn">Новая запись</button>
        </div>
    </div>

    <!-- РЕДАКТОР -->
    <div class="card hidden" id="editorCard">

        <div class="restore hidden" id="restore">
            <div>В браузере остался несохранённый текст от <span id="restoreWhen"></span>.</div>
            <div class="restore__actions">
                <button type="button" id="restoreYes">Вернуть</button>
                <button type="button" class="btn--quiet" id="restoreNo">Забыть</button>
            </div>
        </div>

        <div class="field">
            <label for="title">Заголовок</label>
            <input type="text" id="title">
        </div>

        <div class="row">
            <div class="field">
                <label for="slug">Адрес страницы <span class="hint">— латиницей, можно оставить пустым</span></label>
                <input type="text" id="slug" placeholder="соберётся из заголовка">
            </div>
            <div class="field">
                <label for="status">Состояние</label>
                <select id="status">
                    <option value="published">Опубликовано</option>
                    <option value="draft">Черновик</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label for="excerpt">Описание для поиска <span class="hint">— одна фраза; пустое посчитается из текста</span></label>
            <input type="text" id="excerpt">
        </div>

        <div class="field">
            <label for="text">Текст <span class="hint">— ## часть, ### подзаголовок, - список, &gt; цитата, **жирный**, *курсив*, [ссылка](адрес), ![подпись](адрес картинки)</span></label>
            <textarea id="text" placeholder="Первый абзац станет вводным — он выделится сам."></textarea>
        </div>

        <div class="buttons">
            <button type="button" class="btn--main" id="saveBtn">Опубликовать</button>
            <button type="button" id="draftBtn">В черновики</button>
            <button type="button" class="btn--quiet" id="previewBtn">Предпросмотр</button>
            <button type="button" class="btn--quiet" id="cancelBtn">К списку</button>
            <button type="button" class="btn--danger hidden" id="deleteBtn">Удалить</button>
        </div>

        <div class="draft-mark" id="draftMark"></div>
        <div id="editorStatus" class="status"></div>
    </div>

    <!-- ПРЕДПРОСМОТР -->
    <div class="preview" id="preview"></div>

</div>

<script>
const BLOG_API = 'https://blog.emotional-harbor.ru/posts';

// Пароль живёт только в памяти вкладки: ни в cookie, ни в хранилище браузера.
// Закрыли вкладку — забыт.
let password = '';
let posts = [];
let editing = null;   // редактируемая запись или null, если новая

const el = (id) => document.getElementById(id);

function show(box, text, okFlag) {
    box.textContent = text;
    box.className = 'status visible ' + (okFlag ? 'status--ok' : 'status--error');
}

function hide(box) { box.className = 'status'; }

async function api(method, body) {
    const res = await fetch(BLOG_API, {
        method,
        headers: { 'Content-Type': 'application/json', 'X-Blog-Password': password },
        body: body ? JSON.stringify(body) : undefined,
    });

    if (res.status === 401) throw new Error('Неверный пароль');

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Что-то не сработало. Попробуйте ещё раз.');

    return data;
}

// ---------- вход ----------

el('enterBtn').addEventListener('click', async () => {
    password = el('password').value;
    if (!password) return show(el('gateStatus'), 'Введите пароль.', false);

    el('enterBtn').disabled = true;
    try {
        posts = await api('GET');
        el('gate').classList.add('hidden');
        el('listCard').classList.remove('hidden');
        renderPosts();
    } catch (err) {
        show(el('gateStatus'), err.message, false);
    } finally {
        el('enterBtn').disabled = false;
    }
});

el('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') el('enterBtn').click();
});

// ---------- список ----------

function renderPosts() {
    const box = el('posts');
    box.textContent = '';

    if (!posts.length) {
        const empty = document.createElement('div');
        empty.className = 'note';
        empty.textContent = 'Записей пока нет.';
        box.appendChild(empty);
        return;
    }

    posts.forEach((post) => {
        const row = document.createElement('div');
        row.className = 'post-row';

        const main = document.createElement('div');
        main.className = 'post-row__main';

        const title = document.createElement('div');
        title.className = 'post-row__title';
        title.textContent = post.title;

        const meta = document.createElement('div');
        meta.className = 'post-row__meta';

        const tag = document.createElement('span');
        const draft = post.status === 'draft';
        tag.className = 'tag ' + (draft ? 'tag--draft' : 'tag--live');
        tag.textContent = draft ? 'черновик' : 'опубликовано';

        meta.appendChild(tag);
        meta.appendChild(document.createTextNode(
            new Date(post.date).toLocaleDateString('ru-RU') + ' · /' + post.slug
        ));

        main.appendChild(title);
        main.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'post-row__actions';

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = 'Изменить';
        edit.addEventListener('click', () => openEditor(post));

        actions.appendChild(edit);

        row.appendChild(main);
        row.appendChild(actions);
        box.appendChild(row);
    });
}

// ---------- редактор ----------

// ---------- черновик в браузере ----------
//
// Всё, что набрано, каждую секунду откладывается в память браузера —
// на случай закрытой вкладки, упавшего браузера или нечаянного «назад».
// Пароль сюда не попадает: он живёт только в переменной и умирает с вкладкой.
// Хранится на Вашем компьютере, никуда не отправляется.

const DRAFT_KEY = 'eh_blog_draft';
let draftTimer = null;

function draftBox() {
    return {
        for: editing ? editing.slug : '',
        title: el('title').value,
        slug: el('slug').value,
        excerpt: el('excerpt').value,
        text: el('text').value,
        status: el('status').value,
        savedAt: new Date().toISOString(),
    };
}

function saveDraft() {
    try {
        const box = draftBox();
        // Пустое не храним, чтобы не предлагать восстановить пустоту
        if (!box.title.trim() && !box.text.trim()) return localStorage.removeItem(DRAFT_KEY);
        localStorage.setItem(DRAFT_KEY, JSON.stringify(box));
        el('draftMark').textContent = 'сохранено в браузере · ' +
            new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    } catch (err) {
        // Приватный режим может запрещать хранение — молчим, но не падаем
    }
}

function readDraft() {
    try {
        const raw = localStorage.getItem(DRAFT_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch (err) {
        return null;
    }
}

function dropDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch (err) {}
    el('draftMark').textContent = '';
    el('restore').classList.add('hidden');
}

['title', 'slug', 'excerpt', 'text', 'status'].forEach((id) => {
    el(id).addEventListener('input', () => {
        clearTimeout(draftTimer);
        draftTimer = setTimeout(saveDraft, 1000);
    });
});

// Уход со страницы с несохранённым текстом — переспрашиваем
window.addEventListener('beforeunload', (e) => {
    if (el('editorCard').classList.contains('hidden')) return;
    if (!el('text').value.trim()) return;
    e.preventDefault();
    e.returnValue = '';
});

function offerRestore() {
    const box = readDraft();
    const mine = box && box.for === (editing ? editing.slug : '');

    // Предлагаем вернуть только то, что отличается от загруженного
    if (!mine || (box.title === el('title').value && box.text === el('text').value)) {
        el('restore').classList.add('hidden');
        return;
    }

    el('restoreWhen').textContent = new Date(box.savedAt).toLocaleString('ru-RU');
    el('restore').classList.remove('hidden');
}

el('restoreYes').addEventListener('click', () => {
    const box = readDraft();
    if (!box) return;

    el('title').value = box.title;
    el('slug').value = box.slug;
    el('excerpt').value = box.excerpt;
    el('text').value = box.text;
    el('status').value = box.status;
    el('restore').classList.add('hidden');
});

el('restoreNo').addEventListener('click', dropDraft);

function openEditor(post) {
    editing = post || null;

    el('title').value = post ? post.title : '';
    el('slug').value = post ? post.slug : '';
    el('excerpt').value = post ? (post.excerpt || '') : '';
    el('text').value = post ? post.text : '';
    el('status').value = post && post.status === 'draft' ? 'draft' : 'published';

    el('saveBtn').textContent = post ? 'Сохранить' : 'Опубликовать';
    el('deleteBtn').classList.toggle('hidden', !post);

    el('listCard').classList.add('hidden');
    el('editorCard').classList.remove('hidden');
    el('preview').classList.remove('visible');
    el('draftMark').textContent = '';
    hide(el('editorStatus'));
    offerRestore();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToList() {
    el('editorCard').classList.add('hidden');
    el('preview').classList.remove('visible');
    el('listCard').classList.remove('hidden');
    renderPosts();
}

el('newBtn').addEventListener('click', () => openEditor(null));
el('cancelBtn').addEventListener('click', backToList);

async function save(statusValue) {
    const title = el('title').value.trim();
    const text = el('text').value.trim();

    if (!title || !text) return show(el('editorStatus'), 'Заполните заголовок и текст.', false);

    const payload = {
        action: editing ? 'update' : 'create',
        title,
        text,
        excerpt: el('excerpt').value.trim(),
        status: statusValue,
        newSlug: el('slug').value.trim(),
    };

    if (editing) payload.slug = editing.slug;

    el('saveBtn').disabled = true;
    el('draftBtn').disabled = true;

    try {
        await api('POST', payload);
        posts = await api('GET');
        show(el('editorStatus'),
            statusValue === 'draft'
                ? 'Сохранено в черновики — на сайте не появится.'
                : 'Опубликовано. Страница соберётся в течение четверти часа.',
            true);
        dropDraft();
        editing = null;
        setTimeout(backToList, 1200);
    } catch (err) {
        show(el('editorStatus'), err.message, false);
    } finally {
        el('saveBtn').disabled = false;
        el('draftBtn').disabled = false;
    }
}

el('saveBtn').addEventListener('click', () => save(el('status').value));
el('draftBtn').addEventListener('click', () => save('draft'));

el('deleteBtn').addEventListener('click', async () => {
    if (!editing) return;
    if (!confirm('Удалить запись «' + editing.title + '»? Вернуть её будет нельзя.')) return;

    try {
        await api('POST', { action: 'delete', slug: editing.slug });
        posts = await api('GET');
        dropDraft();
        editing = null;
        backToList();
    } catch (err) {
        show(el('editorStatus'), err.message, false);
    }
});

// ---------- предпросмотр ----------

// Те же правила разметки, что у сборщика страниц: пустая строка — абзац,
// ## часть, ### подзаголовок, - список, 1. список, > цитата, **жирный**.
function renderMarkup(text) {
    const escape = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const inline = (s) => escape(s)
        .replace(/\[([^\]]+)\]\((\/[^\s)]*|https?:\/\/[^\s)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/\*\*(\S(?:[\s\S]*?\S)?)\*\*/g, '<strong>$1</strong>')
        .replace(/(?<!\*)\*(\S(?:[^*]*\S)?)\*(?!\*)/g, '<em>$1</em>');
    let leadUsed = false;

    return text.replace(/\r\n/g, '\n').split(/\n{2,}/).map((raw) => {
        const block = raw.trim();
        if (!block) return '';

        const lines = block.split('\n').map((l) => l.trim()).filter(Boolean);

        const pic = block.match(/^!\[([^\]]*)\]\((\/[^\s)]*|https?:\/\/[^\s)]+)\)$/);
        if (pic) {
            return '<figure class="shot"><img src="' + pic[2] + '" alt=""><figcaption>' +
                escape(pic[1]) + '</figcaption></figure>';
        }

        if (block.startsWith('## ')) return '<h2>' + inline(block.slice(3)) + '</h2>';
        if (block.startsWith('### ')) return '<h3>' + inline(block.slice(4)) + '</h3>';

        if (lines.every((l) => l.startsWith('>'))) {
            return '<blockquote>' + lines.map((l) => inline(l.replace(/^>\s?/, ''))).join('<br>') + '</blockquote>';
        }

        if (lines.every((l) => l.startsWith('- '))) {
            return '<ul>' + lines.map((l) => '<li>' + inline(l.slice(2)) + '</li>').join('') + '</ul>';
        }

        if (lines.every((l) => /^\d+[.)]\s/.test(l))) {
            return '<ol>' + lines.map((l) => '<li>' + inline(l.replace(/^\d+[.)]\s+/, '')) + '</li>').join('') + '</ol>';
        }

        const cls = leadUsed ? '' : ' class="lead"';
        leadUsed = true;
        return '<p' + cls + '>' + inline(block).replace(/\n/g, '<br>') + '</p>';
    }).join('');
}

el('previewBtn').addEventListener('click', () => {
    const box = el('preview');
    const title = el('title').value.trim();
    const words = el('text').value.trim().split(/\s+/).filter(Boolean).length;
    const minutes = Math.max(1, Math.round(words / 180));

    box.innerHTML =
        '<div class="note">Так это будет выглядеть · ' + minutes + ' мин чтения</div>' +
        '<h2>' + title.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</h2>' +
        renderMarkup(el('text').value);

    box.classList.add('visible');
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
