<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="https://static.emotional-harbor.ru/favicon.svg">
    <meta name="robots" content="noindex, nofollow">
    <title>Кажется, не туда · Эмоциональная Гавань</title>
    <link href="https://static.emotional-harbor.ru/fonts/harbor-fonts.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100%;
            min-height: 100vh;
            background: #f7efe0;
            font-family: 'Jost', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 24px;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(201,169,122,0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(201,169,122,0.08) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        .corner-wear { position: fixed; pointer-events: none; z-index: 1; }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card {
            width: 440px;
            max-width: 100%;
            border-radius: 28px;
            background: rgba(255, 248, 235, 0.8);
            border: 1.5px solid rgba(201, 169, 122, 0.4);
            box-shadow: 8px 10px 0 rgba(120,80,40,0.09), 0 20px 40px -12px rgba(120,80,40,0.12);
            padding: 0 44px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            position: relative;
            z-index: 2;
            overflow: hidden;
            animation: arrive 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .card-stripe {
            flex-shrink: 0;
            width: calc(100% + 88px);
            height: 6px;
            background: #F8B4C0;
            margin: 0 0 32px;
        }

        .icon {
            width: 64px;
            height: auto;
            margin-bottom: 4px;
        }

        .title {
            font-family: 'Unbounded', sans-serif;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.5px;
            color: #3a3228;
        }

        .title span { color: #e87a9c; }

        .tagline {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 14px;
            color: #9a7050;
            line-height: 1.6;
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .home-button {
            display: inline-block;
            padding: 15px 32px;
            font-family: 'Jost', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #fff;
            background: #e87a9c;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(232, 122, 156, 0.3);
        }

        .home-button:hover { background-color: #d96b89; }
        .home-button:active { transform: translateY(1px); }
    </style>
</head>
<body>

<svg class="corner-wear" style="top:0;left:0;width:180px;height:180px;" viewBox="0 0 180 180">
    <defs><radialGradient id="cw1" cx="0%" cy="0%"><stop offset="0%" stop-color="#c8b898" stop-opacity="0.35"/><stop offset="70%" stop-color="transparent"/></radialGradient></defs>
    <rect width="180" height="180" fill="url(#cw1)"/>
</svg>
<svg class="corner-wear" style="bottom:0;right:0;width:160px;height:160px;" viewBox="0 0 160 160">
    <defs><radialGradient id="cw2" cx="100%" cy="100%"><stop offset="0%" stop-color="#a89878" stop-opacity="0.22"/><stop offset="70%" stop-color="transparent"/></radialGradient></defs>
    <rect width="160" height="160" fill="url(#cw2)"/>
</svg>

<div class="card">
    <div class="card-stripe"></div>
    <img class="icon" src="https://static.emotional-harbor.ru/Icon_Water-wave.webp" alt="">

    <div class="title">Кажется, эта дверь<br>ведёт не <span>туда</span></div>
    <div class="tagline">Страницы, которую Вы искали, здесь нет.<br>Но Гавань всегда открыта.</div>
    <a class="home-button" href="/">Вернуться в Гавань</a>
</div>

</body>
</html>
